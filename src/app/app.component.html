<div class="container">
  <h2 class="text-center">Registration Form</h2>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" id="name" class="form-control" formControlName="name">
      <div *ngIf="form.get('name')?.invalid && (form.get('name')?.dirty || form.get('name')?.touched)">
        <small class="text-white" *ngIf="form.get('name')?.errors?.['required']">Name is required.</small>
        <small class="text-white" *ngIf="form.get('name')?.errors?.['pattern']">Name must be in alphabets.</small>
      </div>
    </div>

    <div class="form-group">
      <label for="age">Age:</label>
      <input type="text" id="age" class="form-control" formControlName="age">
      <div *ngIf="form.get('age')?.invalid && (form.get('age')?.dirty || form.get('age')?.touched)">
        <small class="text-white" *ngIf="form.get('age')?.errors?.['required']">Age is required.</small>
        <small class="text-white" *ngIf="form.get('age')?.errors?.['pattern']">Age must be a number.</small>
      </div>
    </div>

    <div class="form-group">
      <label for="city">City:</label>
      <select id="city" class="form-control" formControlName="city">
        <option value="">Select a city</option>
        <option value="New York">New York</option>
        <option value="Los Angeles">Los Angeles</option>
        <option value="Chicago">Chicago</option>
      </select>
      <div *ngIf="form.get('city')?.invalid && (form.get('city')?.dirty || form.get('city')?.touched)">
        <small class="text-white" *ngIf="form.get('city')?.errors?.['required']">City is required.</small>
      </div>
    </div>

    <div class="form-group">
      <label for="form-check-input">Select Gender:</label>
      <div class="form-check">
        <input type="radio" id="male" class="form-check-input" formControlName="gender" value="male" >
        <label for="male" class="form-check-label">Male</label>
      </div>
      <div class="form-check">
        <input type="radio" id="female" class="form-check-input" formControlName="gender" value="female" >
        <label for="female" class="form-check-label">Female</label>
      </div>
      <div *ngIf="form.get('gender')?.invalid && (form.get('gender')?.dirty || form.get('gender')?.touched)">
        <small class="text-white">Gender is required.</small>
      </div>
    </div>

    <div class="form-group">
      <div class="form-check">
        <input type="checkbox" id="agree" class="form-check-input" formControlName="agree" >
        <label for="agree" class="form-check-label">I agree to the terms and conditions</label>
      </div>
      <div *ngIf="form.get('agree')?.invalid && (form.get('agree')?.dirty || form.get('agree')?.touched)">
        <small class="text-white">You must agree to the terms and conditions.</small>
      </div>
    </div>

    <div class="form-group text-center">
      <button type="submit" class="btn btn-primary">Submit</button>
      <button type="button" class="btn btn-secondary" (click)="resetForm()">Reset</button>
    </div>
  </form>
</div>
