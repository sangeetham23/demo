<div class="container">
  <h2 class="text-center">Registration Form</h2>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-form-field class="form-group">
      <mat-label>Name:</mat-label>
      <input matInput type="text" formControlName="name">
      <mat-error *ngIf="form.get('name')?.invalid && (form.get('name')?.dirty || form.get('name')?.touched)">
        <span *ngIf="form.get('name')?.errors?.['required']">Name is required.</span>
        <span *ngIf="form.get('name')?.errors?.['pattern']">Name must be in alphabets.</span>
      </mat-error>
    </mat-form-field>

    <mat-form-field class="form-group">
      <mat-label>Age:</mat-label>
      <input matInput type="text" formControlName="age">
      <mat-error *ngIf="form.get('age')?.invalid && (form.get('age')?.dirty || form.get('age')?.touched)">
        <span *ngIf="form.get('age')?.errors?.['required']">Age is required.</span>
        <span *ngIf="form.get('age')?.errors?.['pattern']">Age must be a number.</span>
      </mat-error>
    </mat-form-field>

    <mat-form-field class="form-group">
      <mat-label>City:</mat-label>
      <mat-select formControlName="city">
        <mat-option value="">Select a city</mat-option>
        <mat-option value="New York">New York</mat-option>
        <mat-option value="Los Angeles">Los Angeles</mat-option>
        <mat-option value="Chicago">Chicago</mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('city')?.invalid && (form.get('city')?.dirty || form.get('city')?.touched)">
        <span *ngIf="form.get('city')?.errors?.['required']">City is required.</span>
      </mat-error>
    </mat-form-field>

    <div class="form-group">
      <label for="form-check-input">Select Gender:</label>
      <div class="form-check">
        <mat-radio-group formControlName="gender">
          <mat-radio-button value="male">Male</mat-radio-button>
          <mat-radio-button value="female">Female</mat-radio-button>
        </mat-radio-group>
      </div>
      <mat-error *ngIf="form.get('gender')?.invalid && (form.get('gender')?.dirty || form.get('gender')?.touched)">
        <span class="text-white">Gender is required.</span>
      </mat-error>
    </div>

    <div class="form-group">
      <div class="form-check">
        <mat-checkbox formControlName="agree">
          I agree to the terms and conditions
        </mat-checkbox>
      </div>
      <mat-error *ngIf="form.get('agree')?.invalid && (form.get('agree')?.dirty || form.get('agree')?.touched)">
        <span class="text-white">You must agree to the terms and conditions.</span>
      </mat-error>
    </div>

    <div class="form-group text-center">
      <button mat-raised-button type="submit" class="btn btn-primary">Submit</button>
      <button mat-raised-button type="button" class="btn btn-secondary" (click)="resetForm()">Reset</button>
    </div>
  </form>
</div>
