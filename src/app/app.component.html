<div class="container">
  <h1 class="text-center">Registration Form</h1>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-5">
    <div class="row justify-content-center">
      <div class="mb-3 col-6">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" class="form-control" formControlName="name">
        <div *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="invalid-feedback d-block">{{ getErrorMessage('name') }}</div>
      </div>
    </div>
   
    <div class="row justify-content-center">
      <div class="mb-3 col-6">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" formControlName="password">
        <div *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="invalid-feedback d-block">{{ getErrorMessage('password') }}</div>
      </div>
    </div>
    
    <div class="row justify-content-center">
      <div class="mb-3 col-6">
        <label for="accNum" class="form-label">Account Number</label>
        <input type="number" id="accNum" class="form-control" formControlName="accNum">
        <div *ngIf="form.get('accNum')?.invalid && form.get('accNum')?.touched" class="invalid-feedback d-block">{{ getErrorMessage('accNum') }}</div>
      </div>
    </div>
    

    <div class="row justify-content-center">
      <div class="mb-3 col-6">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" formControlName="email">
        <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="invalid-feedback d-block">{{ getErrorMessage('email') }}</div>
      </div>
    </div>
    

    <div class="row justify-content-center">
      <div class="mb-3 col-6">
        <label for="phoneNum" class="form-label">Phone Number</label>
        <input type="tel" id="phoneNum" class="form-control" formControlName="phoneNum">
        <div *ngIf="form.get('phoneNum')?.invalid && form.get('phoneNum')?.touched" class="invalid-feedback d-block">{{ getErrorMessage('phoneNum') }}</div>
      </div>
    </div>
    

    <div class="row justify-content-center">
      <div class="mb-3 col-6">
        <label for="address" class="form-label">Address</label>
        <input type="text" id="address" class="form-control" formControlName="address">
        <div *ngIf="form.get('address')?.invalid && form.get('address')?.touched" class="invalid-feedback d-block">{{ getErrorMessage('address') }}</div>
      </div>
    </div>
    

    <div class="row justify-content-center">
      <div class="mb-3 col-6">
        <label for="dob" class="form-label">Date of Birth</label>
        <input type="text" id="dob" class="form-control" formControlName="dob">
        <div *ngIf="form.get('dob')?.invalid && form.get('dob')?.touched" class="invalid-feedback d-block">{{ getErrorMessage('dob') }}</div>
      </div>
    </div>


    <div class="col-12 text-center">
      <button type="submit" [disabled]="form.invalid" class="btn btn-primary">Submit</button>
    </div>
  </form>
</div>
