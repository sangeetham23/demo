<div class="container">
    <h2 class="text-center">Additional Information</h2>
    <form [formGroup]="additionalForm">
      <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" class="form-control" formControlName="username">
        <div *ngIf="additionalForm.get('username')?.invalid && (additionalForm.get('username')?.dirty || additionalForm.get('username')?.touched)">
          <small class="text-white" *ngIf="additionalForm.get('username')?.errors?.['required']">Username is required.</small>
        </div>
      </div>
  
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" class="form-control" formControlName="password">
        <div *ngIf="additionalForm.get('password')?.invalid && (additionalForm.get('password')?.dirty || additionalForm.get('password')?.touched)">
          <small class="text-white" *ngIf="additionalForm.get('password')?.errors?.['required']">Password is required.</small>
        </div>
      </div>
  
      <div class="form-group">
        <label for="confirmPassword">Confirm Password:</label>
        <input type="password" id="confirmPassword" class="form-control" formControlName="confirmPassword">
        <div *ngIf="additionalForm.get('confirmPassword')?.invalid && (additionalForm.get('confirmPassword')?.dirty || additionalForm.get('confirmPassword')?.touched)">
          <small class="text-white" *ngIf="additionalForm.get('confirmPassword')?.errors?.['required']">Confirm Password is required.</small>
        </div>
      </div>
  
      <div class="form-group">
        <label for="securityQuestion">Security Question:</label>
        <input type="text" id="securityQuestion" class="form-control" formControlName="securityQuestion">
        <div *ngIf="additionalForm.get('securityQuestion')?.invalid && (additionalForm.get('securityQuestion')?.dirty || additionalForm.get('securityQuestion')?.touched)">
          <small class="text-white" *ngIf="additionalForm.get('securityQuestion')?.errors?.['required']">Security Question is required.</small>
        </div>
      </div>
  
      <div class="form-group">
        <label for="securityAnswer">Security Answer:</label>
        <input type="text" id="securityAnswer" class="form-control" formControlName="securityAnswer">
        <div *ngIf="additionalForm.get('securityAnswer')?.invalid && (additionalForm.get('securityAnswer')?.dirty || additionalForm.get('securityAnswer')?.touched)">
          <small class="text-white" *ngIf="additionalForm.get('securityAnswer')?.errors?.['required']">Security Answer is required.</small>
        </div>
      </div>
  
      <div class="form-group form-check">
        <input type="checkbox" id="agreeTerms" class="form-check-input" formControlName="agreeTerms">
        <label class="form-check-label" for="agreeTerms">I agree to the Terms and Conditions</label>
        <div *ngIf="additionalForm.get('agreeTerms')?.invalid && (additionalForm.get('agreeTerms')?.dirty || additionalForm.get('agreeTerms')?.touched)">
          <small class="text-white" *ngIf="additionalForm.get('agreeTerms')?.errors?.['required']">You must agree to the Terms and Conditions.</small>
        </div>
      </div>
  
      <div class="form-group text-center">
        <button type="button" class="btn btn-primary" (click)="onBack()">Back</button>
        <button type="submit" class="btn btn-primary" (click)="onSubmit()" [disabled]="additionalForm.invalid">Submit</button>
        <button type="button" class="btn btn-secondary" (click)="resetForm()">Reset</button>
      </div>
    </form>
  </div>
